default_install_hook_types: [pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ruff-format-check
        name: ruff format --check
        entry: ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest (excluding slow)
        entry: pytest tests/ -m "not slow" -v
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: pip-outdated
        name: outdated project dependencies (informational, never blocks)
        entry: python tools/check_outdated_deps.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true
