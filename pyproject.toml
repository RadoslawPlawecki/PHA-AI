[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom"
version = "0.1.0"
description = "Phageome-based disease classification tool for multiclass prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "imbalanced_learn>=0.14.1",
    "imblearn>=0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "questionary>=2.1.1",
    "scikit_bio>=0.7.3",
    "scikit_learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "xgboost>=3.3.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/phantom/other",          # pre-refactor, not wired into any controller
    "src/phantom/visualization",  # pre-refactor, pending port-vs-delete triage
    "tests",                      # pre-refactor flat layout; fail at collection, rewrite pending
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is owned by `ruff format`; don't also lint it in strings/comments
    "B008",    # function call in argument default (questionary idiom)
    "SIM108",  # ternary-instead-of-if — hurts readability as often as it helps
]

[tool.ruff.lint.isort]
known-first-party = ["phantom"]