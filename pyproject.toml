[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom"
version = "0.1.0"
description = "Phageome-based disease classification tool for multiclass prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "imbalanced_learn>=0.14.2",
    "imblearn>=0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "questionary>=2.1.1",
    "scikit_bio>=0.7.4",
    "scikit_learn>=1.9.1",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tomlkit>=0.15.1",
    "tqdm>=4.70.1",
    "xgboost>=3.3.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.8",
    "pytest>=9.1.1",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "pytest-randomly>=5.0.0",
    "freezegun>=1.5",
    "hypothesis>=6.168.1",
    "coverage[toml]>=7.16.1",
    "pre-commit>=4.0",
    "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
pythonpath = ["."]
norecursedirs = ["fixtures", "_helpers"]
markers = [
    "slow: real catboost/xgb/PERMANOVA or large Optuna budgets (nightly only)",
    "ml: exercises classification/ml on a real estimator",
    "property: hypothesis-based",
    "integration: touches the filesystem / multi-component",
    "controller: drives a *Controller with mocked prompts",
    "critical: covers a business-critical path (see tests/README.md)",
    "flaky: known non-deterministic, quarantined (non-blocking job)",
]

[tool.coverage.run]
branch = true
source = ["src/phantom"]
omit = [
    "src/phantom/other/*",
    "src/phantom/visualization/*",
    "*/__main__.py",
    "src/phantom/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def from_args",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/phantom/other",          # pre-refactor, not wired into any controller
    "src/phantom/visualization",  # pre-refactor, pending port-vs-delete triage
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is owned by `ruff format`; don't also lint it in strings/comments
    "B008",    # function call in argument default (questionary idiom)
    "SIM108",  # ternary-instead-of-if — hurts readability as often as it helps
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point in tests
    "PLR2004", # magic values are fine in test data/assertions
]

[tool.ruff.lint.isort]
known-first-party = ["phantom"]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "^src/phantom/other/",         # pre-refactor, not wired into any controller
    "^src/phantom/visualization/", # pre-refactor, pending port-vs-delete triage
]
