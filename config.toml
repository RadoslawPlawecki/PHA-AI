# ============================================================
# Virus identification tools
# ============================================================

[tools]
geN = "genomad"
VIB = "vibrant"
VS2 = "virsorter2"

# ============================================================
# Paths
# ============================================================

[megahit]
path = "data/megahit"
type = "directory"
description = "Metagenome assemblies generated using the MEGAHIT assembler."


[genomad]
path = "data/genomad"
type = "directory"
description = "Viral sequence predictions and annotations generated using geNomad."
viral_fna = "*_assembly.contigs_virus.fna"


[vibrant]
path = "data/vibrant"
type = "directory"
description = "VIBRANT-based viral sequence annotations and auxiliary files."
viral_fna = "*_assembly.contigs.phages_combined.fna"


[virsorter2]
path = "data/virsorter2"
type = "directory"
description = "Viral sequence predictions and annotations generated using VirSorter2."
viral_fna = "final-viral-combined.fa"


[genomes]
path = "data/genomes"
type = "directory"
description = "Putative viral genomes identified by viral identification tools."


[checkv]
path = "data/checkv"
type = "directory"
description = "Genome quality assessment results generated using CheckV."


[masks]
path = "data/masks"
type = "directory"
description = "CheckV masks generated to filter sequences based on completeness and contamination criteria."


[features]
path = "data/features"
type = "directory"
description = "Versioned data features used as inputs for downstream classification and machine learning workflows."


[features.v1_0]
path = "data/features/1.0"
version = "1.0"
type = "directory"


[features.v1_0.raw]
path = "raw"
type = "directory"
description = "Raw feature files stored separately for each sample before merging and preprocessing."


[features.v1_0.raw_merged]
path = "raw-merged"
type = "directory"
description = "Merged raw feature data combined into unified files containing all samples."


[features.v1_0.preprocessed]
path = "preprocessed"
type = "directory"
description = "Preprocessed feature data."


[features.v1_0.extracted]
path = "extracted"
type = "directory"
description = "Extracted feature representations used as input for classifier training and prediction."


