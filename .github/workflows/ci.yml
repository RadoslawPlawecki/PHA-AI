name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: codespell
        run: codespell
      - name: mypy
        run: mypy src/phantom
      - name: pre-commit hygiene hooks
        run: |
          pre-commit run trailing-whitespace --all-files --hook-stage pre-push
          pre-commit run check-merge-conflict --all-files --hook-stage pre-push
          pre-commit run check-added-large-files --all-files --hook-stage pre-push

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest tests/ -m "not slow"
